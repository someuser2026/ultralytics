# MMRotate parity preset for configs/planet_nearmap_448/rotated_faster_rcnn_r50_fpn_1x_rgb10075s_le90.py
# The reference file uses UnravelNet; the model path below follows that exact backbone choice.
task: obb
model: ultralytics/cfg/models/rcnn/rotated_faster_rcnn_unravelnet_fpn_le90.yaml
data: ultralytics/cfg/datasets/planet_nearmap10075s_448_obb.yaml
