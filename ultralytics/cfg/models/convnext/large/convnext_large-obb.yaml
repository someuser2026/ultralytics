# ConvNeXt-Large-like OBB model with P3/8 - P5/32 outputs

# Parameters
nc: 80

# Backbone
backbone:
  - [-1, 1, ConvNeXtStem,       [192]]                      # Layer 0: Downsample by 4x
  - [-1, 3, ConvNeXtBlock,      [192, 0.0, 0.0, True]]      # Layer 1: No downsampling
  - [-1, 1, ConvNeXtDownsample, [384]]                      # Layer 2: Downsample by 2x (to 8x)
  - [-1, 3, ConvNeXtBlock,      [384, 0.0, 0.0, True]]      # Layer 3: No downsampling
  - [-1, 1, ConvNeXtDownsample, [768]]                      # Layer 4: Downsample by 2x (to 16x)
  - [-1, 27, ConvNeXtBlock,     [768, 0.0, 0.0, True]]      # Layer 5: No downsampling
  - [-1, 1, ConvNeXtDownsample, [1536]]                     # Layer 6: Downsample by 2x (to 32x)
  - [-1, 3, ConvNeXtBlock,      [1536, 0.0, 0.0, True]]     # Layer 7: No downsampling

# Head
head:
  - [-1, 1, nn.Upsample,        [None, 2, "nearest"]]       # Layer 8: Upsample by 2x (from 32x to 16x)
  - [[-1, 5], 1, Concat,        [1]]                       # Layer 9: Concatenate Layer 8 (16x) and Backbone Layer 5 (16x)
  - [-1, 3, C2f,                [1024]]                    # Layer 10: C2f module with 1024 channels (16x)

  - [-1, 1, nn.Upsample,        [None, 2, "nearest"]]       # Layer 11: Upsample by 2x (from 16x to 8x)
  - [[-1, 3], 1, Concat,        [1]]                       # Layer 12: Concatenate Layer 11 (8x) and Backbone Layer 3 (8x)
  - [-1, 3, C2f,                [512]]                     # Layer 13: C2f module with 512 channels (8x)

  - [-1, 1, Conv,               [512, 3, 2]]               # Layer 14: Downsample by 2x (from 8x to 16x) using Conv
  - [[-1, 11], 1, Concat,       [1]]                       # Layer 15: Concatenate Layer 14 (16x) and Layer 11 (16x)
  - [-1, 3, C2f,                [1024]]                    # Layer 16: C2f module with 1024 channels (16x)

  - [-1, 1, Conv,               [1024, 3, 2]]              # Layer 17: Downsample by 2x (from 16x to 32x) using Conv
  - [[-1, 7], 1, Concat,        [1]]                       # Layer 18: Concatenate Layer 17 (32x) and Backbone Layer 7 (32x)
  - [-1, 3, C2f,                [1536]]                    # Layer 19: C2f module with 1536 channels (32x)

  - [[13, 16, 19], 1, OBB, [nc, 1]]
