# ConvNeXt-Tiny-like OBB model with P3/8 - P5/32 outputs

# Parameters
nc: 80  # number of classes

# Backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, ConvNeXtStem, [96]]
  - [-1, 3, ConvNeXtBlock, [96, 0.0, 0.0, True]]
  - [-1, 1, ConvNeXtDownsample, [192]]
  - [-1, 3, ConvNeXtBlock, [192, 0.0, 0.0, True]]
  - [-1, 1, ConvNeXtDownsample, [384]]
  - [-1, 9, ConvNeXtBlock, [384, 0.0, 0.0, True]]
  - [-1, 1, ConvNeXtDownsample, [768]]
  - [-1, 3, ConvNeXtBlock, [768, 0.0, 0.0, True]]

# Head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 3], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 3, C2f, [768]]

  - [[14, 17, 20], 1, OBB, [nc, 1]]
