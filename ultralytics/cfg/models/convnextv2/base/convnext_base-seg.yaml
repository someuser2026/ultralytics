# ConvNeXt-Base-like segmentation model with P3/8 - P5/32 outputs

# Parameters
nc: 80

# Backbone
backbone:
  - [-1, 1, ConvNeXtStem, [128]]
  - [-1, 3, ConvNeXtBlock, [128, 0.0, 0.0, True]]
  - [-1, 1, ConvNeXtDownsample, [256]]
  - [-1, 3, ConvNeXtBlock, [256, 0.0, 0.0, True]]
  - [-1, 1, ConvNeXtDownsample, [512]]
  - [-1, 27, ConvNeXtBlock, [512, 0.0, 0.0, True]]
  - [-1, 1, ConvNeXtDownsample, [1024]]
  - [-1, 3, ConvNeXtBlock, [1024, 0.0, 0.0, True]]

# Head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]]
  - [-1, 3, C2f, [768]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 3], 1, Concat, [1]]
  - [-1, 3, C2f, [384]]

  - [-1, 1, Conv, [384, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 3, C2f, [768]]

  - [-1, 1, Conv, [768, 3, 2]]
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]

  - [[14, 17, 20], 1, Segment, [nc, 32, 256]]
