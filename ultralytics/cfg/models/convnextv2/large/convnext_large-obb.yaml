# ConvNeXt-Large-like OBB model with P3/8 - P5/32 outputs

# Parameters
nc: 80

# Backbone
backbone:
  - [-1, 1, ConvNeXtStem, [192]]
  - [-1, 3, ConvNeXtBlock, [192, 0.0, 0.0, True]]
  - [-1, 1, ConvNeXtDownsample, [384]]
  - [-1, 3, ConvNeXtBlock, [384, 0.0, 0.0, True]]
  - [-1, 1, ConvNeXtDownsample, [768]]
  - [-1, 27, ConvNeXtBlock, [768, 0.0, 0.0, True]]
  - [-1, 1, ConvNeXtDownsample, [1536]]
  - [-1, 3, ConvNeXtBlock, [1536, 0.0, 0.0, True]]

# Head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 3], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]

  - [-1, 1, Conv, [1024, 3, 2]]
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 3, C2f, [1536]]

  - [[14, 17, 20], 1, OBB, [nc, 1]]
