# ResNet-50 + Rotated FCOS benchmark model with canonical P3-P7 features.
# Rotated FCOS is anchor-free, so the RCNN-only [1, 2, 4] anchor reduction does not apply here.

nc: 80
angle_mode: le90

backbone:
  - [-1, 1, ResNetBackbone, [resnet50, null, 1, true]] # 0 -> [C2, C3, C4, C5]
  - [0, 1, Index, [1]] # 1-C3/8
  - [0, 1, Index, [2]] # 2-C4/16
  - [0, 1, Index, [3]] # 3-C5/32

head:
  - [[1, 2, 3], 1, FPN, [256, {
      implementation: reference,
      num_outs: 5,
      add_extra_convs: "on_output",
      relu_before_extra_convs: true
    }]] # 4 -> [P3, P4, P5, P6, P7]

  - [4, 1, Index, [0]] # 5-P3/8
  - [4, 1, Index, [1]] # 6-P4/16
  - [4, 1, Index, [2]] # 7-P5/32
  - [4, 1, Index, [3]] # 8-P6/64
  - [4, 1, Index, [4]] # 9-P7/128

  - [[5, 6, 7, 8, 9], 1, RotatedFCOS, [
      nc,
      {
        strides: [8, 16, 32, 64, 128],
        regress_ranges: [[-1, 64], [64, 128], [128, 256], [256, 512], [512, 100000000.0]],
        center_sampling: true,
        center_sample_radius: 1.5,
        norm_on_bbox: true,
        centerness_on_reg: true,
        scale_angle: true,
        bbox_loss_type: rotated_iou
      }
    ]] # 10
