# LEGNet-small Rotated FCOS model with P3/8 - P7/128 outputs
# Knob-test variant:
# - center_sampling: false
# - bbox_loss_type: probiou

nc: 80
angle_mode: le90

backbone:
  # [from, repeats, module, args]
  - [-1, 1, LWEGNet, [64, [1, 4, 4, 2], 2.0, 0.1]] # 0 -> [P2, P3, P4, P5]

head:
  - [0, 1, Index, [1]] # 1-P3/8
  - [0, 1, Index, [2]] # 2-P4/16
  - [0, 1, Index, [3]] # 3-P5/32

  - [[1, 2, 3], 1, FPN, [256, {num_outs: 5, add_extra_convs: "on_output", relu_before_extra_convs: true}]] # 4

  - [4, 1, Index, [0]] # 5-P3/8
  - [4, 1, Index, [1]] # 6-P4/16
  - [4, 1, Index, [2]] # 7-P5/32
  - [4, 1, Index, [3]] # 8-P6/64
  - [4, 1, Index, [4]] # 9-P7/128

  - [[5, 6, 7, 8, 9], 1, RotatedFCOS, [
      nc,
      {
        strides: [8, 16, 32, 64, 128],
        regress_ranges: [[-1, 64], [64, 128], [128, 256], [256, 512], [512, 100000000.0]],
        center_sampling: false,
        center_sample_radius: 1.5,
        norm_on_bbox: true,
        centerness_on_reg: true,
        scale_angle: true,
        bbox_loss_type: probiou
      }
    ]] # 10
