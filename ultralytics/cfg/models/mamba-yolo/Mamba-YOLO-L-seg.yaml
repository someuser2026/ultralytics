# Official Mamba-YOLO-L architecture with its terminal Detect head replaced by Segment.

nc: 1
scales:
  L: [0.67, 0.75, 768]

backbone:
  - [-1, 1, SimpleStem, [128, 3]] # 0-P2/4
  - [-1, 3, VSSBlock, [128]] # 1
  - [-1, 1, VisionClueMerge, [256]] # 2-P3/8
  - [-1, 3, VSSBlock, [256]] # 3
  - [-1, 1, VisionClueMerge, [512]] # 4-P4/16
  - [-1, 9, VSSBlock, [512]] # 5
  - [-1, 1, VisionClueMerge, [1024]] # 6-P5/32
  - [-1, 3, VSSBlock, [1024]] # 7
  - [-1, 1, SPPF, [1024, 5]] # 8

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, XSSBlock, [512]] # 11

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 3], 1, Concat, [1]] # cat backbone P3
  - [-1, 3, XSSBlock, [256]] # 14 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]] # cat head P4
  - [-1, 3, XSSBlock, [512]] # 17 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]] # cat head P5
  - [-1, 3, XSSBlock, [1024]] # 20 (P5/32-large)

  - [[14, 17, 20], 1, Segment, [nc, 32, 256]] # Segment(P3, P4, P5)
