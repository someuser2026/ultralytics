# OBB model with an HRNet-style multi-resolution Mamba backbone.
# The backbone is the experimental part; the neck/head stay close to standard YOLO OBB wiring.

nc: 80  # number of classes
scales:  # [depth, width, max_channels]
  T: [0.33, 0.25, 1024]
  B: [0.33, 0.50, 1024]
  L: [0.67, 0.75, 768]

backbone:
  # Seed the four-resolution pyramid with Mamba-YOLO blocks.
  - [-1, 1, SimpleStem, [128, 3]]  # 0-P2/4
  - [-1, 2, VSSBlock, [128]]  # 1-P2
  - [-1, 1, VisionClueMerge, [256]]  # 2-P3/8
  - [-1, 2, VSSBlock, [256]]  # 3-P3
  - [-1, 1, VisionClueMerge, [512]]  # 4-P4/16
  - [-1, 2, VSSBlock, [512]]  # 5-P4
  - [-1, 1, VisionClueMerge, [1024]]  # 6-P5/32
  - [-1, 2, VSSBlock, [1024]]  # 7-P5

  # Per-branch refinement before exchange.
  - [1, 1, VSSBlock, [128]]  # 8-P2 refine
  - [3, 1, VSSBlock, [256]]  # 9-P3 refine
  - [5, 1, VSSBlock, [512]]  # 10-P4 refine
  - [7, 1, VSSBlock, [1024]]  # 11-P5 refine

  # HRNet-style full fusion for P2.
  - [9, 1, nn.Upsample, [None, 2, "nearest"]]  # 12 P3 -> P2
  - [10, 1, nn.Upsample, [None, 4, "nearest"]]  # 13 P4 -> P2
  - [11, 1, nn.Upsample, [None, 8, "nearest"]]  # 14 P5 -> P2
  - [[8, 12, 13, 14], 1, Concat, [1]]  # 15
  - [-1, 2, VSSBlock, [128]]  # 16 fused P2

  # HRNet-style full fusion for P3.
  - [8, 1, Conv, [256, 3, 2]]  # 17 P2 -> P3
  - [10, 1, nn.Upsample, [None, 2, "nearest"]]  # 18 P4 -> P3
  - [11, 1, nn.Upsample, [None, 4, "nearest"]]  # 19 P5 -> P3
  - [[17, 9, 18, 19], 1, Concat, [1]]  # 20
  - [-1, 2, VSSBlock, [256]]  # 21 fused P3

  # HRNet-style full fusion for P4.
  - [8, 1, Conv, [256, 3, 2]]  # 22 P2 -> P3
  - [22, 1, Conv, [512, 3, 2]]  # 23 P2 -> P4
  - [9, 1, Conv, [512, 3, 2]]  # 24 P3 -> P4
  - [11, 1, nn.Upsample, [None, 2, "nearest"]]  # 25 P5 -> P4
  - [[23, 24, 10, 25], 1, Concat, [1]]  # 26
  - [-1, 2, VSSBlock, [512]]  # 27 fused P4

  # HRNet-style full fusion for P5.
  - [8, 1, Conv, [256, 3, 2]]  # 28 P2 -> P3
  - [28, 1, Conv, [512, 3, 2]]  # 29 P2 -> P4
  - [29, 1, Conv, [1024, 3, 2]]  # 30 P2 -> P5
  - [9, 1, Conv, [512, 3, 2]]  # 31 P3 -> P4
  - [31, 1, Conv, [1024, 3, 2]]  # 32 P3 -> P5
  - [10, 1, Conv, [1024, 3, 2]]  # 33 P4 -> P5
  - [[30, 32, 33, 11], 1, Concat, [1]]  # 34
  - [-1, 2, VSSBlock, [1024]]  # 35 fused P5
  - [-1, 1, SPPF, [1024, 5]]  # 36 final P5

head:
  - [36, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 27], 1, Concat, [1]]  # cat backbone P4
  - [-1, 2, C3k2, [512, False]]  # 39

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 21], 1, Concat, [1]]  # cat backbone P3
  - [-1, 2, C3k2, [256, False]]  # 42 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 39], 1, Concat, [1]]  # cat head P4
  - [-1, 2, C3k2, [512, False]]  # 45 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 36], 1, Concat, [1]]  # cat head P5
  - [-1, 2, C3k2, [1024, True]]  # 48 (P5/32-large)

  - [[42, 45, 48], 1, OBB, [nc, 1]]  # OBB(P3, P4, P5)
