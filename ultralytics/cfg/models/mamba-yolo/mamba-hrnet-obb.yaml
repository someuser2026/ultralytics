# OBB model with a faithful HRNet-style staged Mamba backbone.
# Stage layout: 1 branch -> 2 branches -> 3 branches -> 4 branches.
# Each branch uses VSSBlock stacks in place of HRNet bottlenecks/basic blocks.

nc: 1  # number of classes
scales:  # [depth, width, max_channels]
  T: [0.33, 0.25, 1024]
  B: [0.33, 0.50, 1024]
  L: [0.67, 0.75, 768]

backbone:
  # Stem + Stage 1 (single high-resolution branch)
  - [-1, 1, SimpleStem, [128, 3]]  # 0-P2/4
  - [-1, 2, VSSBlock, [128]]  # 1 Stage1-B1

  # Transition 1: 1 -> 2 branches
  - [1, 1, VSSBlock, [128]]  # 2 Stage2-B1 transition
  - [1, 1, Conv, [256, 3, 2]]  # 3 Stage2-B2 downsample
  - [-1, 1, VSSBlock, [256]]  # 4 Stage2-B2 transition

  # Stage 2 branches
  - [2, 2, VSSBlock, [128]]  # 5 Stage2-B1
  - [4, 2, VSSBlock, [256]]  # 6 Stage2-B2

  # Stage 2 exchange fusion
  - [6, 1, nn.Upsample, [None, 2, "nearest"]]  # 7 B2 -> B1
  - [[5, 7], 1, Concat, [1]]  # 8
  - [-1, 2, VSSBlock, [128]]  # 9 Stage2 fused B1
  - [5, 1, Conv, [256, 3, 2]]  # 10 B1 -> B2
  - [[10, 6], 1, Concat, [1]]  # 11
  - [-1, 2, VSSBlock, [256]]  # 12 Stage2 fused B2

  # Transition 2: 2 -> 3 branches
  - [12, 1, Conv, [512, 3, 2]]  # 13 Stage3-B3 downsample
  - [-1, 1, VSSBlock, [512]]  # 14 Stage3-B3 transition

  # Stage 3 branches
  - [9, 2, VSSBlock, [128]]  # 15 Stage3-B1
  - [12, 2, VSSBlock, [256]]  # 16 Stage3-B2
  - [14, 2, VSSBlock, [512]]  # 17 Stage3-B3

  # Stage 3 exchange fusion
  - [16, 1, nn.Upsample, [None, 2, "nearest"]]  # 18 B2 -> B1
  - [17, 1, nn.Upsample, [None, 4, "nearest"]]  # 19 B3 -> B1
  - [[15, 18, 19], 1, Concat, [1]]  # 20
  - [-1, 2, VSSBlock, [128]]  # 21 Stage3 fused B1
  - [15, 1, Conv, [256, 3, 2]]  # 22 B1 -> B2
  - [17, 1, nn.Upsample, [None, 2, "nearest"]]  # 23 B3 -> B2
  - [[22, 16, 23], 1, Concat, [1]]  # 24
  - [-1, 2, VSSBlock, [256]]  # 25 Stage3 fused B2
  - [15, 1, Conv, [256, 3, 2]]  # 26 B1 -> temp P3
  - [26, 1, Conv, [512, 3, 2]]  # 27 B1 -> B3
  - [16, 1, Conv, [512, 3, 2]]  # 28 B2 -> B3
  - [[27, 28, 17], 1, Concat, [1]]  # 29
  - [-1, 2, VSSBlock, [512]]  # 30 Stage3 fused B3

  # Transition 3: 3 -> 4 branches
  - [30, 1, Conv, [1024, 3, 2]]  # 31 Stage4-B4 downsample
  - [-1, 1, VSSBlock, [1024]]  # 32 Stage4-B4 transition

  # Stage 4 branches
  - [21, 2, VSSBlock, [128]]  # 33 Stage4-B1
  - [25, 2, VSSBlock, [256]]  # 34 Stage4-B2
  - [30, 2, VSSBlock, [512]]  # 35 Stage4-B3
  - [32, 2, VSSBlock, [1024]]  # 36 Stage4-B4

  # Final exchange fusion (4 branches)
  - [34, 1, nn.Upsample, [None, 2, "nearest"]]  # 37 B2 -> B1
  - [35, 1, nn.Upsample, [None, 4, "nearest"]]  # 38 B3 -> B1
  - [36, 1, nn.Upsample, [None, 8, "nearest"]]  # 39 B4 -> B1
  - [[33, 37, 38, 39], 1, Concat, [1]]  # 40
  - [-1, 2, VSSBlock, [128]]  # 41 final P2

  - [33, 1, Conv, [256, 3, 2]]  # 42 B1 -> B2
  - [35, 1, nn.Upsample, [None, 2, "nearest"]]  # 43 B3 -> B2
  - [36, 1, nn.Upsample, [None, 4, "nearest"]]  # 44 B4 -> B2
  - [[42, 34, 43, 44], 1, Concat, [1]]  # 45
  - [-1, 2, VSSBlock, [256]]  # 46 final P3

  - [33, 1, Conv, [256, 3, 2]]  # 47 B1 -> temp P3
  - [47, 1, Conv, [512, 3, 2]]  # 48 B1 -> B3
  - [34, 1, Conv, [512, 3, 2]]  # 49 B2 -> B3
  - [36, 1, nn.Upsample, [None, 2, "nearest"]]  # 50 B4 -> B3
  - [[48, 49, 35, 50], 1, Concat, [1]]  # 51
  - [-1, 2, VSSBlock, [512]]  # 52 final P4

  - [33, 1, Conv, [256, 3, 2]]  # 53 B1 -> temp P3
  - [53, 1, Conv, [512, 3, 2]]  # 54 B1 -> temp P4
  - [54, 1, Conv, [1024, 3, 2]]  # 55 B1 -> B4
  - [34, 1, Conv, [512, 3, 2]]  # 56 B2 -> temp P4
  - [56, 1, Conv, [1024, 3, 2]]  # 57 B2 -> B4
  - [35, 1, Conv, [1024, 3, 2]]  # 58 B3 -> B4
  - [[55, 57, 58, 36], 1, Concat, [1]]  # 59
  - [-1, 2, VSSBlock, [1024]]  # 60 final P5
  - [-1, 1, SPPF, [1024, 5]]  # 61 final P5 + context

head:
  - [61, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 52], 1, Concat, [1]]  # cat backbone P4
  - [-1, 2, C3k2, [512, False]]  # 64

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 46], 1, Concat, [1]]  # cat backbone P3
  - [-1, 2, C3k2, [256, False]]  # 67

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 41], 1, Concat, [1]]  # cat backbone P2
  - [-1, 2, C3k2, [128, False]]  # 70 (P2/4-xsmall)

  - [70, 1, Conv, [256, 3, 2]]
  - [[-1, 67], 1, Concat, [1]]  # cat head P3
  - [-1, 2, C3k2, [256, False]]  # 73 (P3/8-small)

  - [73, 1, Conv, [512, 3, 2]]
  - [[-1, 64], 1, Concat, [1]]  # cat head P4
  - [-1, 2, C3k2, [512, False]]  # 76 (P4/16-medium)

  - [76, 1, Conv, [512, 3, 2]]
  - [[-1, 61], 1, Concat, [1]]  # cat head P5
  - [-1, 2, C3k2, [1024, True]]  # 79 (P5/32-large)

  - [[70, 73, 76, 79], 1, OBB, [nc, 1]]  # OBB(P2, P3, P4, P5)
