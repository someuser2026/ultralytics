# Dual-branch OBB model with a Mamba-HRNet RGB backbone and ResNet auxiliary backbone.

nc: 1
dual_input_backbone: true
dual_input_rgb_channels: 3
dual_input_fusion: concat_proj
scales:
  T: [0.33, 0.25, 1024]
  B: [0.33, 0.50, 1024]
  L: [0.67, 0.75, 768]

backbone:
  - [-1, 1, ChannelSplit, [3]] # 0 -> [rgb, aux]
  - [0, 1, Index, [0]] # 1 rgb input
  - [0, 1, Index, [1]] # 2 aux input

  # RGB branch: Mamba-HRNet backbone
  - [1, 1, SimpleStem, [128, 3]] # 3-P2/4
  - [-1, 2, VSSBlock, [128]] # 4 Stage1-B1
  - [4, 1, VSSBlock, [128]] # 5 Stage2-B1 transition
  - [4, 1, Conv, [256, 3, 2]] # 6 Stage2-B2 downsample
  - [-1, 1, VSSBlock, [256]] # 7 Stage2-B2 transition
  - [5, 2, VSSBlock, [128]] # 8 Stage2-B1
  - [7, 2, VSSBlock, [256]] # 9 Stage2-B2
  - [9, 1, nn.Upsample, [None, 2, "nearest"]] # 10 B2 -> B1
  - [[8, 10], 1, Concat, [1]] # 11
  - [-1, 2, VSSBlock, [128]] # 12 Stage2 fused B1
  - [8, 1, Conv, [256, 3, 2]] # 13 B1 -> B2
  - [[13, 9], 1, Concat, [1]] # 14
  - [-1, 2, VSSBlock, [256]] # 15 Stage2 fused B2
  - [15, 1, Conv, [512, 3, 2]] # 16 Stage3-B3 downsample
  - [-1, 1, VSSBlock, [512]] # 17 Stage3-B3 transition
  - [12, 2, VSSBlock, [128]] # 18 Stage3-B1
  - [15, 2, VSSBlock, [256]] # 19 Stage3-B2
  - [17, 2, VSSBlock, [512]] # 20 Stage3-B3
  - [19, 1, nn.Upsample, [None, 2, "nearest"]] # 21 B2 -> B1
  - [20, 1, nn.Upsample, [None, 4, "nearest"]] # 22 B3 -> B1
  - [[18, 21, 22], 1, Concat, [1]] # 23
  - [-1, 2, VSSBlock, [128]] # 24 Stage3 fused B1
  - [18, 1, Conv, [256, 3, 2]] # 25 B1 -> B2
  - [20, 1, nn.Upsample, [None, 2, "nearest"]] # 26 B3 -> B2
  - [[25, 19, 26], 1, Concat, [1]] # 27
  - [-1, 2, VSSBlock, [256]] # 28 Stage3 fused B2
  - [18, 1, Conv, [256, 3, 2]] # 29 B1 -> temp P3
  - [29, 1, Conv, [512, 3, 2]] # 30 B1 -> B3
  - [19, 1, Conv, [512, 3, 2]] # 31 B2 -> B3
  - [[30, 31, 20], 1, Concat, [1]] # 32
  - [-1, 2, VSSBlock, [512]] # 33 Stage3 fused B3
  - [33, 1, Conv, [1024, 3, 2]] # 34 Stage4-B4 downsample
  - [-1, 1, VSSBlock, [1024]] # 35 Stage4-B4 transition
  - [24, 2, VSSBlock, [128]] # 36 Stage4-B1
  - [28, 2, VSSBlock, [256]] # 37 Stage4-B2
  - [33, 2, VSSBlock, [512]] # 38 Stage4-B3
  - [35, 2, VSSBlock, [1024]] # 39 Stage4-B4
  - [37, 1, nn.Upsample, [None, 2, "nearest"]] # 40 B2 -> B1
  - [38, 1, nn.Upsample, [None, 4, "nearest"]] # 41 B3 -> B1
  - [39, 1, nn.Upsample, [None, 8, "nearest"]] # 42 B4 -> B1
  - [[36, 40, 41, 42], 1, Concat, [1]] # 43
  - [-1, 2, VSSBlock, [128]] # 44 final P2
  - [36, 1, Conv, [256, 3, 2]] # 45 B1 -> B2
  - [38, 1, nn.Upsample, [None, 2, "nearest"]] # 46 B3 -> B2
  - [39, 1, nn.Upsample, [None, 4, "nearest"]] # 47 B4 -> B2
  - [[45, 37, 46, 47], 1, Concat, [1]] # 48
  - [-1, 2, VSSBlock, [256]] # 49 final P3
  - [36, 1, Conv, [256, 3, 2]] # 50 B1 -> temp P3
  - [50, 1, Conv, [512, 3, 2]] # 51 B1 -> B3
  - [37, 1, Conv, [512, 3, 2]] # 52 B2 -> B3
  - [39, 1, nn.Upsample, [None, 2, "nearest"]] # 53 B4 -> B3
  - [[51, 52, 38, 53], 1, Concat, [1]] # 54
  - [-1, 2, VSSBlock, [512]] # 55 final P4
  - [36, 1, Conv, [256, 3, 2]] # 56 B1 -> temp P3
  - [56, 1, Conv, [512, 3, 2]] # 57 B1 -> temp P4
  - [57, 1, Conv, [1024, 3, 2]] # 58 B1 -> B4
  - [37, 1, Conv, [512, 3, 2]] # 59 B2 -> temp P4
  - [59, 1, Conv, [1024, 3, 2]] # 60 B2 -> B4
  - [38, 1, Conv, [1024, 3, 2]] # 61 B3 -> B4
  - [[58, 60, 61, 39], 1, Concat, [1]] # 62
  - [-1, 2, VSSBlock, [1024]] # 63 final P5
  - [-1, 1, SPPF, [1024, 5]] # 64 final P5 + context

  # Auxiliary branch: simple ResNet backbone
  - [2, 1, ResNetBackbone, [resnet50, null, 1, true]] # 65 -> [C2, C3, C4, C5]
  - [65, 1, Index, [1]] # 66 aux P3/C3
  - [65, 1, Index, [2]] # 67 aux P4/C4
  - [65, 1, Index, [3]] # 68 aux P5/C5

  # Fuse same-scale P3/P4/P5 features by concat + 1x1 projection
  - [[49, 66], 1, Concat, [1]] # 69 fused P3 concat
  - [-1, 1, Conv, [256, 1, 1]] # 70 fused P3
  - [[55, 67], 1, Concat, [1]] # 71 fused P4 concat
  - [-1, 1, Conv, [512, 1, 1]] # 72 fused P4
  - [[64, 68], 1, Concat, [1]] # 73 fused P5 concat
  - [-1, 1, Conv, [1024, 1, 1]] # 74 fused P5

head:
  - [74, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 72], 1, Concat, [1]] # 76 cat fused P4
  - [-1, 2, C3k2, [512, False]] # 77

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 70], 1, Concat, [1]] # 79 cat fused P3
  - [-1, 2, C3k2, [256, False]] # 80 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 77], 1, Concat, [1]] # 82 cat head P4
  - [-1, 2, C3k2, [512, False]] # 83 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 74], 1, Concat, [1]] # 85 cat head P5
  - [-1, 2, C3k2, [1024, True]] # 86 (P5/32-large)

  - [[80, 83, 86], 1, OBB, [nc, 1]] # OBB(P3, P4, P5)
