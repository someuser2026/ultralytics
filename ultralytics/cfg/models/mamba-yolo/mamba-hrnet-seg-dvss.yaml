# HRVMamba-base segmentation model expressed as an explicit Ultralytics YAML graph.
# Reference backbone: channels 80/160/320/640, stage modules 1/4/2, two DVSS blocks per branch.
# Model scales are intentionally absent: all widths, depths, and drop-path values are fixed to the reference config.

nc: 1
depth_multiple: 1.0
width_multiple: 1.0

backbone:
  # Stem: two 3x3 stride-2 Conv-BN-ReLU layers.
  - [-1, 1, HRConv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, HRConv, [64, 3, 2]]  # 1-P2/4

  # Stage 1: two ResNet bottlenecks, 64 -> 256.
  - [-1, 1, HRBottleneck, [256]]  # 2
  - [-1, 1, HRBottleneck, [256]]  # 3

  # Transition 1: one P2 branch becomes P2/P3 branches with widths 80/160.
  - [3, 1, HRConv, [80, 3, 1]]  # 4 Stage2-B1
  - [3, 1, HRConv, [160, 3, 2]]  # 5 Stage2-B2

  # Stage 2, module 1/1. Drop path pair: 0.0 -> 0.01153846.
  - [4, 1, DVSSBlock, [80, 0.0]]  # 6 B1 block 1
  - [-1, 1, DVSSBlock, [80, 0.0115384615]]  # 7 B1 block 2
  - [5, 1, DVSSBlock, [160, 0.0]]  # 8 B2 block 1
  - [-1, 1, DVSSBlock, [160, 0.0115384615]]  # 9 B2 block 2
  - [[7, 9], 1, HRFusion, [0]]  # 10 fused B1 (add + ReLU)
  - [[7, 9], 1, HRFusion, [1]]  # 11 fused B2 (add + ReLU)

  # Transition 2: retain B1/B2 and create B3 from the previous coarsest branch.
  - [11, 1, HRConv, [320, 3, 2]]  # 12 Stage3-B3

  # Stage 3, module 1/4. Drop path pair: 0.02307692 -> 0.03461538.
  - [10, 1, DVSSBlock, [80, 0.0230769231]]  # 13
  - [-1, 1, DVSSBlock, [80, 0.0346153846]]  # 14
  - [11, 1, DVSSBlock, [160, 0.0230769231]]  # 15
  - [-1, 1, DVSSBlock, [160, 0.0346153846]]  # 16
  - [12, 1, DVSSBlock, [320, 0.0230769231]]  # 17
  - [-1, 1, DVSSBlock, [320, 0.0346153846]]  # 18
  - [[14, 16, 18], 1, HRFusion, [0]]  # 19 fused B1
  - [[14, 16, 18], 1, HRFusion, [1]]  # 20 fused B2
  - [[14, 16, 18], 1, HRFusion, [2]]  # 21 fused B3

  # Stage 3, module 2/4. Drop path pair: 0.04615385 -> 0.05769231.
  - [19, 1, DVSSBlock, [80, 0.0461538462]]  # 22
  - [-1, 1, DVSSBlock, [80, 0.0576923077]]  # 23
  - [20, 1, DVSSBlock, [160, 0.0461538462]]  # 24
  - [-1, 1, DVSSBlock, [160, 0.0576923077]]  # 25
  - [21, 1, DVSSBlock, [320, 0.0461538462]]  # 26
  - [-1, 1, DVSSBlock, [320, 0.0576923077]]  # 27
  - [[23, 25, 27], 1, HRFusion, [0]]  # 28 fused B1
  - [[23, 25, 27], 1, HRFusion, [1]]  # 29 fused B2
  - [[23, 25, 27], 1, HRFusion, [2]]  # 30 fused B3

  # Stage 3, module 3/4. Drop path pair: 0.06923077 -> 0.08076923.
  - [28, 1, DVSSBlock, [80, 0.0692307692]]  # 31
  - [-1, 1, DVSSBlock, [80, 0.0807692308]]  # 32
  - [29, 1, DVSSBlock, [160, 0.0692307692]]  # 33
  - [-1, 1, DVSSBlock, [160, 0.0807692308]]  # 34
  - [30, 1, DVSSBlock, [320, 0.0692307692]]  # 35
  - [-1, 1, DVSSBlock, [320, 0.0807692308]]  # 36
  - [[32, 34, 36], 1, HRFusion, [0]]  # 37 fused B1
  - [[32, 34, 36], 1, HRFusion, [1]]  # 38 fused B2
  - [[32, 34, 36], 1, HRFusion, [2]]  # 39 fused B3

  # Stage 3, module 4/4. Drop path pair: 0.09230769 -> 0.10384615.
  - [37, 1, DVSSBlock, [80, 0.0923076923]]  # 40
  - [-1, 1, DVSSBlock, [80, 0.1038461538]]  # 41
  - [38, 1, DVSSBlock, [160, 0.0923076923]]  # 42
  - [-1, 1, DVSSBlock, [160, 0.1038461538]]  # 43
  - [39, 1, DVSSBlock, [320, 0.0923076923]]  # 44
  - [-1, 1, DVSSBlock, [320, 0.1038461538]]  # 45
  - [[41, 43, 45], 1, HRFusion, [0]]  # 46 fused B1
  - [[41, 43, 45], 1, HRFusion, [1]]  # 47 fused B2
  - [[41, 43, 45], 1, HRFusion, [2]]  # 48 fused B3

  # Transition 3: retain B1/B2/B3 and create B4 from the previous coarsest branch.
  - [48, 1, HRConv, [640, 3, 2]]  # 49 Stage4-B4

  # Stage 4, module 1/2. Drop path pair: 0.11538462 -> 0.12692308.
  - [46, 1, DVSSBlock, [80, 0.1153846154]]  # 50
  - [-1, 1, DVSSBlock, [80, 0.1269230769]]  # 51
  - [47, 1, DVSSBlock, [160, 0.1153846154]]  # 52
  - [-1, 1, DVSSBlock, [160, 0.1269230769]]  # 53
  - [48, 1, DVSSBlock, [320, 0.1153846154]]  # 54
  - [-1, 1, DVSSBlock, [320, 0.1269230769]]  # 55
  - [49, 1, DVSSBlock, [640, 0.1153846154]]  # 56
  - [-1, 1, DVSSBlock, [640, 0.1269230769]]  # 57
  - [[51, 53, 55, 57], 1, HRFusion, [0]]  # 58 fused B1
  - [[51, 53, 55, 57], 1, HRFusion, [1]]  # 59 fused B2
  - [[51, 53, 55, 57], 1, HRFusion, [2]]  # 60 fused B3
  - [[51, 53, 55, 57], 1, HRFusion, [3]]  # 61 fused B4

  # Stage 4, module 2/2. Drop path pair: 0.13846154 -> 0.15.
  - [58, 1, DVSSBlock, [80, 0.1384615385]]  # 62
  - [-1, 1, DVSSBlock, [80, 0.15]]  # 63
  - [59, 1, DVSSBlock, [160, 0.1384615385]]  # 64
  - [-1, 1, DVSSBlock, [160, 0.15]]  # 65
  - [60, 1, DVSSBlock, [320, 0.1384615385]]  # 66
  - [-1, 1, DVSSBlock, [320, 0.15]]  # 67
  - [61, 1, DVSSBlock, [640, 0.1384615385]]  # 68
  - [-1, 1, DVSSBlock, [640, 0.15]]  # 69
  - [[63, 65, 67, 69], 1, HRFusion, [0]]  # 70 final HR B1
  - [[63, 65, 67, 69], 1, HRFusion, [1]]  # 71 final HR B2
  - [[63, 65, 67, 69], 1, HRFusion, [2]]  # 72 final HR B3
  - [[63, 65, 67, 69], 1, HRFusion, [3]]  # 73 final HR B4

  # Reference HRFuseScales: increase each branch, progressively downsample, and add.
  - [70, 1, HRBottleneck, [128]]  # 74 increased P2
  - [71, 1, HRBottleneck, [256]]  # 75 increased P3
  - [72, 1, HRBottleneck, [512]]  # 76 increased P4
  - [73, 1, HRBottleneck, [1024]]  # 77 increased P5
  - [74, 1, HRConv, [256, 3, 2]]  # 78 P2 -> P3
  - [[78, 75], 1, HRAdd, [false]]  # 79 P3
  - [79, 1, HRConv, [512, 3, 2]]  # 80 P3 -> P4
  - [[80, 76], 1, HRAdd, [false]]  # 81 P4
  - [81, 1, HRConv, [1024, 3, 2]]  # 82 P4 -> P5
  - [[82, 77], 1, HRAdd, [false]]  # 83 fused P5
  - [83, 1, HRConv, [2048, 1, 1]]  # 84 final P5 projection

  # Reference output normalization on P2/P3/P4/P5.
  - [74, 1, LayerNorm2d, [128, 0.00001]]  # 85 P2/4, 128 channels
  - [79, 1, LayerNorm2d, [256, 0.00001]]  # 86 P3/8, 256 channels
  - [81, 1, LayerNorm2d, [512, 0.00001]]  # 87 P4/16, 512 channels
  - [84, 1, LayerNorm2d, [2048, 0.00001]]  # 88 P5/32, 2048 channels
  - [88, 1, SPPF, [1024, 5]]  # 89 P5 context for the YOLO segmentation head

head:
  - [89, 1, nn.Upsample, [null, 2, "nearest"]]  # 90
  - [[-1, 87], 1, Concat, [1]]  # 91 cat backbone P4
  - [-1, 2, C3k2, [512, false]]  # 92

  - [-1, 1, nn.Upsample, [null, 2, "nearest"]]  # 93
  - [[-1, 86], 1, Concat, [1]]  # 94 cat backbone P3
  - [-1, 2, C3k2, [256, false]]  # 95

  - [-1, 1, nn.Upsample, [null, 2, "nearest"]]  # 96
  - [[-1, 85], 1, Concat, [1]]  # 97 cat backbone P2
  - [-1, 2, C3k2, [128, false]]  # 98 P2/4

  - [98, 1, Conv, [256, 3, 2]]  # 99
  - [[-1, 95], 1, Concat, [1]]  # 100 cat head P3
  - [-1, 2, C3k2, [256, false]]  # 101 P3/8

  - [101, 1, Conv, [512, 3, 2]]  # 102
  - [[-1, 92], 1, Concat, [1]]  # 103 cat head P4
  - [-1, 2, C3k2, [512, false]]  # 104 P4/16

  - [104, 1, Conv, [512, 3, 2]]  # 105
  - [[-1, 89], 1, Concat, [1]]  # 106 cat head P5
  - [-1, 2, C3k2, [1024, true]]  # 107 P5/32

  - [[98, 101, 104, 107], 1, Segment, [nc, 32, 256]]  # 108 Segment(P2, P3, P4, P5)
