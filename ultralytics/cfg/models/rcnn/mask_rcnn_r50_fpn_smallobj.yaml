# Explicit small-object Mask R-CNN variant.
# The native RCNN stack already uses a C2-based FPN with stride-4 proposals and small anchors.

nc: 80
stride: 32

backbone:
  # Scratch-initialized, fully trainable timm ResNet-50; stages 1-4 are C2-C5.
  - [-1, 1, Timm, [resnet50, false, 3, true, [1, 2, 3, 4], 32, null, auto, false, false, false, false, 0.0, 0.0]] # 0 -> [C2, C3, C4, C5]
  - [0, 1, Index, [0]]
  - [0, 1, Index, [1]]
  - [0, 1, Index, [2]]
  - [0, 1, Index, [3]]

head:
  - [[1, 2, 3, 4], 1, FPN, [256, {implementation: reference, num_outs: 5}]]
  - [[5], 1, MaskRCNNHead, [nc, {
      rpn: {
        anchor_scales: [1, 2, 4],
        anchor_ratios: [0.5, 1.0, 2.0],
        strides: [4, 8, 16, 32, 64],
        pre_nms_topk_train: 2000,
        post_nms_topk_train: 1000,
        pre_nms_topk_test: 1000,
        post_nms_topk_test: 1000,
        nms_thresh: 0.7,
        min_box_size: 0.0,
        pos_iou: 0.7,
        neg_iou: 0.3,
        min_pos_iou: 0.3,
        match_low_quality: true,
        gt_max_assign_all: true,
        samples_per_img: 256,
        pos_fraction: 0.5,
        beta: 0.1111111111111111
      },
      roi: {pool_size: 7, mask_pool_size: 14, sampling_ratio: 0, featmap_strides: [4, 8, 16, 32]},
      train: {pos_iou: 0.5, neg_iou: 0.5, samples_per_img: 512, pos_fraction: 0.25},
      test: {score_thresh: 0.05, nms_iou: 0.5, max_dets: 100},
      bbox_head: {hidden_dim: 1024, loss: l1, beta: 1.0},
      mask_head: {dim: 256, num_convs: 4, resolution: 28}
    }]]
