# LEGNet-small + Oriented R-CNN benchmark model.
# The C2-based reference FPN and [1, 2, 4] RPN scales are retained for small rip-current targets.

nc: 80
angle_mode: le90
stride: 32

backbone:
  - [-1, 1, LWEGNet, [64, [1, 4, 4, 2], 2.0, 0.1]] # 0 -> [C2, C3, C4, C5]
  - [0, 1, Index, [0]]
  - [0, 1, Index, [1]]
  - [0, 1, Index, [2]]
  - [0, 1, Index, [3]]

head:
  - [[1, 2, 3, 4], 1, FPN, [256, {implementation: reference, num_outs: 5}]]
  - [[5], 1, OrientedRCNNHead, [nc, {
      angle_mode: le90,
      rpn: {
        anchor_scales: [1, 2, 4],
        anchor_ratios: [0.5, 1.0, 2.0],
        strides: [4, 8, 16, 32, 64],
        pre_nms_topk_train: 2000,
        post_nms_topk_train: 2000,
        pre_nms_topk_test: 2000,
        post_nms_topk_test: 2000,
        nms_thresh: 0.8,
        min_box_size: 0.0,
        pos_iou: 0.7,
        neg_iou: 0.3,
        min_pos_iou: 0.3,
        match_low_quality: true,
        gt_max_assign_all: true,
        samples_per_img: 256,
        pos_fraction: 0.5,
        beta: 0.1111111111111111
      },
      roi: {pool_size: 7, sampling_ratio: 2, featmap_strides: [4, 8, 16, 32]},
      train: {pos_iou: 0.5, neg_iou: 0.5, samples_per_img: 512, pos_fraction: 0.25},
      test: {score_thresh: 0.05, nms_iou: 0.1, max_dets: 2000},
      bbox_head: {hidden_dim: 1024, beta: 1.0}
    }]]
