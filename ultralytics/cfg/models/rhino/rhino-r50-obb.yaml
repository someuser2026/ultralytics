# RHINO PHC-Haus R50 parity model. All RHINO behavior remains in RHINO-only modules.

nc: 80
scales:
  l: [1.00, 1.00, 1024]

rhino:
  version: v2
  num_queries: 900
  num_denoising_queries: 100
  dn_group_mode: dynamic
  max_num_groups: 30
  max_candidates: 500
  focal_alpha: 0.25
  focal_gamma: 2.0
  matcher_costs:
    - {type: focal, weight: 2.0}
    - {type: hausdorff, weight: 5.0, num_points: 4}
    - {type: gdcost, loss_type: kld, fun: log1p, tau: 1.0, alpha: 1.0, sqrt: false, weight: 5.0}
  dn_matcher_costs:
    - {type: focal, weight: 2.0}
    - {type: hausdorff, weight: 5.0, num_points: 4}
    - {type: gdcost, loss_type: kld, fun: log1p, tau: 1.0, alpha: 1.0, sqrt: false, weight: 5.0}
  loss_weights: {class: 1.0, bbox: 5.0, giou: 5.0, no_object: 0.0}
  loss_types: {bbox: l1, giou: kld}

backbone:
  - [-1, 1, Timm, [
      resnet50,
      false,
      3,
      true,
      [2, 3, 4],
      32,
      null,
      auto,
      false,
      false,
      false,
      false,
      0.0,
      0.0
    ]]
  - [0, 1, Index, [0]]
  - [0, 1, Index, [1]]
  - [0, 1, Index, [2]]

head:
  - [[1, 2, 3], 1, RHINOOBBDecoder, [nc, 256, 900, 4, 8, 6, 2048]]
