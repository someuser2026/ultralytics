# number of classes
nc: 2
stride: 224

backbone:
  - [-1, 1, Timm, ['hrnet_w32', False, 3, True, [0, 1, 2, 3], 28, null, 'auto', False, False, True, False]]  # [0] HRNet-W32 (4 outputs)

head:
  # --------------------------------------------------------------------------
  # Pick HRNet feature maps (assumed: [0]=highest-res ... [3]=lowest-res)
  # --------------------------------------------------------------------------
  - [0, 1, Index, [0]]  # [1] P2-like
  - [0, 1, Index, [1]]  # [2] P3-like
  - [0, 1, Index, [2]]  # [3] P4-like
  - [0, 1, Index, [3]]  # [4] P5-like

  # --------------------------------------------------------------------------
  # Top-down (FPN): P5 -> P4 -> P3 -> P2
  # --------------------------------------------------------------------------
  - [4, 1, nn.Upsample, [None, 2, "nearest"]]  # [5] P5 up -> P4
  - [[5, 3], 1, Concat, [1]]                   # [6] + backbone P4
  - [-1, 2, C3k2, [512, False]]                # [7] P4_fpn

  - [7, 1, nn.Upsample, [None, 2, "nearest"]]  # [8] P4 up -> P3
  - [[8, 2], 1, Concat, [1]]                   # [9] + backbone P3
  - [-1, 2, C3k2, [256, False]]                # [10] P3_fpn

  - [10, 1, nn.Upsample, [None, 2, "nearest"]] # [11] P3 up -> P2
  - [[11, 1], 1, Concat, [1]]                  # [12] + backbone P2
  - [-1, 2, C3k2, [128, False]]                # [13] P2_out (smallest stride)

  # --------------------------------------------------------------------------
  # Bottom-up (PAN): P2 -> P3 -> P4 -> P5
  # --------------------------------------------------------------------------
  - [13, 1, Conv, [256, 3, 2]]                 # [14] down -> P3
  - [[14, 10], 1, Concat, [1]]                 # [15] + P3_fpn
  - [-1, 2, C3k2, [256, False]]                # [16] P3_out

  - [16, 1, Conv, [256, 3, 2]]                 # [17] down -> P4
  - [[17, 7], 1, Concat, [1]]                  # [18] + P4_fpn
  - [-1, 2, C3k2, [256, False]]                # [19] P4_out

  - [19, 1, Conv, [256, 3, 2]]                 # [20] down -> P5
  - [[20, 4], 1, Concat, [1]]                  # [21] + backbone P5
  - [-1, 2, C3k2, [256, True]]                # [22] P5_out

  # --------------------------------------------------------------------------
  # Segmentation head (4 scales incl. P2)
  # --------------------------------------------------------------------------
  - [[13, 16, 19, 22], 1, Segment, [nc, 32, 256]]  # [23]