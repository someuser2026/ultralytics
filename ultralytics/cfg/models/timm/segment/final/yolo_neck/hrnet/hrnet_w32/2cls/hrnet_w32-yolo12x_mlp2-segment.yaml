# number of classes
nc: 2
stride: 224

backbone:
  - [-1, 1, Timm, ['hrnet_w32', False, 3, True, [0, 1, 2, 3], 28, null, 'auto', False, False, True, False]]  # [0] HRNet-W32 (4 outputs)

head:
  # --------------------------------------------------------------------------
  # HRNet feature picks (assumed order: x4, x8, x16, x32)
  # --------------------------------------------------------------------------
  - [0, 1, Index, [0]]  # [1] P2 (x4)
  - [0, 1, Index, [1]]  # [2] P3 (x8)
  - [0, 1, Index, [2]]  # [3] P4 (x16)
  - [0, 1, Index, [3]]  # [4] P5 (x32)

  # --------------------------------------------------------------------------
  # FPN top-down: P5 -> P4 -> P3 -> P2
  # --------------------------------------------------------------------------
  - [4, 1, nn.Upsample, [None, 2, "nearest"]]          # [5] P5 up -> P4
  - [[5, 3], 1, Concat, [1]]                           # [6] + backbone P4=[3]
  - [-1, 2, A2C2f, [256, True, 8, False, 1.2]]         # [7] P4_fpn

  - [7, 1, nn.Upsample, [None, 2, "nearest"]]          # [8] P4 up -> P3
  - [[8, 2], 1, Concat, [1]]                           # [9] + backbone P3=[2]
  - [-1, 2, A2C2f, [128, True, 8, False, 1.2]]         # [10] P3_fpn

  - [10, 1, nn.Upsample, [None, 2, "nearest"]]         # [11] P3 up -> P2
  - [[11, 1], 1, Concat, [1]]                          # [12] + backbone P2=[1]
  - [-1, 2, A2C2f, [128, True, 8, False, 1.2]]         # [13] P2_out

  # --------------------------------------------------------------------------
  # PAN bottom-up: P2 -> P3 -> P4 -> P5
  # --------------------------------------------------------------------------
  - [13, 1, Conv, [256, 3, 2]]                         # [14] P2 down -> P3
  - [[14, 10], 1, Concat, [1]]                         # [15] + P3_fpn=[10]
  - [-1, 2, A2C2f, [128, True, 8, False, 1.2]]         # [16] P3_out

  - [16, 1, Conv, [256, 3, 2]]                         # [17] P3 down -> P4
  - [[17, 7], 1, Concat, [1]]                          # [18] + P4_fpn=[7]
  - [-1, 2, A2C2f, [128, True, 8, False, 1.2]]         # [19] P4_out

  - [19, 1, Conv, [256, 3, 2]]                         # [20] P4 down -> P5
  - [[20, 4], 1, Concat, [1]]                          # [21] + backbone P5=[4]
  - [-1, 2, C3k2, [256, True]]                        # [22] P5_out

  # --------------------------------------------------------------------------
  # Segmentation head (4 scales incl. P2)
  # --------------------------------------------------------------------------
  - [[13, 16, 19, 22], 1, Segment, [nc, 32, 256]]      # [23]
