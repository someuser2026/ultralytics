# number of classes
nc: 1
stride: 224
# backbone
backbone:
  - [-1, 1, Timm, ['hrnet_w32', False, 3, True, [0, 1, 2, 3], 28, null, 'auto', False, False, True, False]]  # Layer 0: Timm backbone (x16)

head:
  # Extract features from Timm backbone
  - [0, 1, Index, [0]]                                       # Layer 1: Backbone Layer 0 (x4)
  - [0, 1, Index, [1]]                                       # Layer 2: Backbone Layer 1 (x8)
  - [0, 1, Index, [2]]                                       # Layer 3: Backbone Layer 2 (x16)
  - [0, 1, Index, [3]]                                       # Layer 4: Backbone Layer 3 (x32)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # (768, 40, 40)
  - [[-1, 3], 1, Concat, [1]] # cat backbone P4 (N, 40, 40)
  - [-1, 2, A2C2f, [512, True, 2, False, 1.2]] # 13 (768, 40, 40)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # (768, 80, 80)
  - [[-1, 2], 1, Concat, [1]] # cat backbone P3 (N, 80, 80)
  - [-1, 2, A2C2f, [256, True, 2, False, 2]] # 13 (768, 40, 40)
  # - [-1, 2, A2C2f, [256, True, -1]] # 16 (P3/8-small) (384, 80, 80)

  - [-1, 1, Conv, [256, 3, 2]] # (384, 40, 40)
  - [[-1, 7], 1, Concat, [1]] # cat head P4 (N, 40, 40)
  - [-1, 2, A2C2f, [256, True, 2, False, 1.2]] # 13 (768, 40, 40)
  # - [-1, 2, A2C2f, [512, True, -1]] # 19 (P4/16-medium) (768, 40, 40)

  - [-1, 1, Conv, [256, 3, 2]] # (768, 20, 20)
  - [[-1, 4], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32-large)
  # --------------------------------------------------------------------------
  # Step 4: Segmentation Head (using 3 scales)
  # --------------------------------------------------------------------------
  - [[10, 13, 16], 1, Segment, [nc, 32, 256]]