# Ultralytics YOLO11-seg instance segmentation model with P2/4 - P5/32 neck outputs
# (Detection head not shown here; this is the neck + Segment head composition)

# Parameters
nc: 4
stride: 224
scales:
  x: [1.00, 1.50, 512]

# YOLO11 backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv,   [64, 3, 2]]             # [0] P1/2
  - [-1, 1, Conv,   [128, 3, 2]]            # [1] P2/4
  - [-1, 2, C3k2,   [256, False, 0.25]]     # [2] P2 refine
  - [-1, 1, Conv,   [256, 3, 2]]            # [3] P3/8
  - [-1, 2, C3k2,   [512, False, 0.25]]     # [4] P3 refine
  - [-1, 1, Conv,   [512, 3, 2]]            # [5] P4/16
  - [-1, 2, C3k2,   [512, True]]            # [6] P4 refine
  - [-1, 1, Conv,   [1024, 3, 2]]           # [7] P5/32
  - [-1, 2, C3k2,   [1024, True]]           # [8] P5 refine
  - [-1, 1, SPPF,   [1024, 5]]              # [9]
  - [-1, 2, C2PSA,  [1024]]                 # [10] P5 final

# Head / Neck
head:
  # --------------------------------------------------------------------------
  # FPN top-down: P5 -> P4 -> P3 -> P2
  # --------------------------------------------------------------------------
  - [10, 1, nn.Upsample, [None, 2, "nearest"]]  # [11] P5 up -> P4
  - [[11, 6], 1, Concat, [1]]                   # [12] + backbone P4=[6]
  - [-1, 2, C3k2, [512, False]]                 # [13] P4_fpn

  - [13, 1, nn.Upsample, [None, 2, "nearest"]]  # [14] P4 up -> P3
  - [[14, 4], 1, Concat, [1]]                   # [15] + backbone P3=[4]
  - [-1, 2, C3k2, [256, False]]                 # [16] P3_fpn

  - [16, 1, nn.Upsample, [None, 2, "nearest"]]  # [17] P3 up -> P2
  - [[17, 2], 1, Concat, [1]]                   # [18] + backbone P2=[2]
  - [-1, 2, C3k2, [128, False]]                 # [19] P2_out

  # --------------------------------------------------------------------------
  # PAN bottom-up: P2 -> P3 -> P4 -> P5
  # --------------------------------------------------------------------------
  - [19, 1, Conv, [256, 3, 2]]                  # [20] P2 down -> P3
  - [[20, 16], 1, Concat, [1]]                  # [21] + P3_fpn=[16]
  - [-1, 2, C3k2, [256, False]]                 # [22] P3_out

  - [22, 1, Conv, [512, 3, 2]]                  # [23] P3 down -> P4
  - [[23, 13], 1, Concat, [1]]                  # [24] + P4_fpn=[13]
  - [-1, 2, C3k2, [512, False]]                 # [25] P4_out

  - [25, 1, Conv, [512, 3, 2]]                  # [26] P4 down -> P5
  - [[26, 10], 1, Concat, [1]]                  # [27] + P5 final=[10]
  - [-1, 2, C3k2, [1024, True]]                 # [28] P5_out

  # --------------------------------------------------------------------------
  # Segment head including P2
  # --------------------------------------------------------------------------
  - [[19, 22, 25, 28], 1, Segment, [nc, 32, 256]]  # [29]
