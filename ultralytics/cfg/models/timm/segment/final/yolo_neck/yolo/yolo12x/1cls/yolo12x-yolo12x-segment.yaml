# YOLO12-seg instance segmentation model with P3/8 - P5/32 outputs

# Parameters
nc: 1
stride: 224
scales:
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                 # [0] P1/2
  - [-1, 1, Conv, [128, 3, 2]]                # [1] P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]         # [2] P2 refine
  - [-1, 1, Conv, [256, 3, 2]]                # [3] P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]         # [4] P3 refine
  - [-1, 1, Conv, [512, 3, 2]]                # [5] P4/16
  - [-1, 4, A2C2f, [512, True, 4]]            # [6] P4 refine
  - [-1, 1, Conv, [1024, 3, 2]]               # [7] P5/32
  - [-1, 4, A2C2f, [1024, True, 1]]           # [8] P5 refine

head:
  # --------------------------------------------------------------------------
  # FPN top-down: P5 -> P4 -> P3
  # --------------------------------------------------------------------------
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # [9]  P5 up -> P4
  - [[-1, 6], 1, Concat, [1]]                  # [10] + backbone P4=[6]
  - [-1, 2, A2C2f, [512, False, -1]]           # [11] P4_fpn

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # [12] P4 up -> P3
  - [[-1, 4], 1, Concat, [1]]                  # [13] + backbone P3=[4]
  - [-1, 2, A2C2f, [256, False, -1]]           # [14] P3_out (small)

  # --------------------------------------------------------------------------
  # PAN bottom-up: P3 -> P4 -> P5
  # --------------------------------------------------------------------------
  - [-1, 1, Conv, [256, 3, 2]]                 # [15] P3 down -> P4
  - [[-1, 11], 1, Concat, [1]]                 # [16] + P4_fpn=[11]
  - [-1, 2, A2C2f, [512, False, -1]]           # [17] P4_out (medium)

  - [-1, 1, Conv, [512, 3, 2]]                 # [18] P4 down -> P5
  - [[-1, 8], 1, Concat, [1]]                  # [19] + backbone P5=[8]
  - [-1, 2, C3k2, [1024, True]]                # [20] P5_out (large)

  # --------------------------------------------------------------------------
  # Segment head: P3, P4, P5
  # --------------------------------------------------------------------------
  - [[14, 17, 20], 1, Segment, [nc, 32, 256]]  # [21]
