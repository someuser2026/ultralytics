# number of classes
nc: 1
stride: 224
# backbone
backbone:
  - [-1, 1, Timm, ['coatnet_0_rw_224.sw_in1k', False, 3, True, [0, 1, 2, 3], 28, null, 'auto', False, False, True, False]]  # Layer 0: Timm backbone

head:
  # Extract features from Timm backbone
  - [0, 1, Index, [0]]                                       # Layer 1: Backbone Layer 0 (x4)
  - [0, 1, Index, [1]]                                       # Layer 2: Backbone Layer 1 (x8)
  - [0, 1, Index, [2]]                                       # Layer 3: Backbone Layer 2 (x16)
  - [0, 1, Index, [3]]                                       # Layer 4: Backbone Layer 3 (x32)

  - [-1, 1, nn.Upsample,        [None, 2, "nearest"]]        # Layer 5: Upsample by 2x (from 32x to 16x)
  - [[-1, 3], 1, Concat,        [1]]                         # Layer 6: Concatenate Layer 5 (16x) and Backbone Layer 3 (16x) - FIXED from [4] to [3]
  - [-1, 1, nn.Identity, []]                                 # Layer 7: Identity layer
  - [-1, 3, C2f,                [768]]                       # Layer 8: C2f module with 768 channels (16x)
  - [-1, 1, nn.Dropout2d,       [0.15]]                      # Layer 9: Dropout2d layer - FIXED typo

  - [-1, 1, nn.Upsample,        [None, 2, "nearest"]]        # Layer 10: Upsample by 2x (from 16x to 8x)
  - [[-1, 2], 1, Concat,        [1]]                         # Layer 11: Concatenate Layer 10 (8x) and Backbone Layer 2 (8x) - FIXED from [3] to [2]
  - [-1, 1, nn.Identity, []]                                 # Layer 12: Identity layer
  - [-1, 3, C2f,                [384]]                       # Layer 13: C2f module with 384 channels (8x)
  - [-1, 1, nn.Dropout2d,       [0.15]]                      # Layer 14: Dropout2d layer - FIXED typo

  - [-1, 1, nn.Upsample,        [None, 2, "nearest"]]        # Layer 15: Upsample by 2x (from 8x to 4x)
  - [[-1, 1], 1, Concat,        [1]]                         # Layer 16: Concatenate Layer 15 (4x) and Backbone Layer 1 (4x) - FIXED from [2] to [1]
  - [-1, 3, C2f,                [192]]                       # Layer 17: C2f module with 192 channels (4x)
  - [-1, 1, nn.Dropout2d,       [0.15]]                      # Layer 18: Dropout2d layer - FIXED typo

  - [-1, 1, Conv,               [192, 3, 2]]                 # Layer 19: Downsample by 2x (from 4x to 8x) using Conv
  - [[-1, 14], 1, Concat,       [1]]                         # Layer 20: Concatenate Layer 19 (8x) and Layer 14 (8x) - FIXED from [13] to [14]
  - [-1, 3, C2f,                [384]]                       # Layer 21: C2f module with 384 channels (8x)
  - [-1, 1, nn.Dropout2d,       [0.15]]                      # Layer 22: Dropout2d layer - FIXED typo

  - [-1, 1, Conv,               [384, 3, 2]]                 # Layer 23: Downsample by 2x (from 8x to 16x) using Conv
  - [[-1, 9], 1, Concat,        [1]]                         # Layer 24: Concatenate Layer 23 (16x) and Layer 9 (16x) - FIXED from [8] to [9]
  - [-1, 3, C2f,                [768]]                       # Layer 25: C2f module with 768 channels (16x)
  - [-1, 1, nn.Dropout2d,       [0.15]]                      # Layer 26: Dropout2d layer - FIXED typo

  - [-1, 1, Conv,               [768, 3, 2]]                 # Layer 27: Downsample by 2x (from 16x to 32x) using Conv
  - [[-1, 4], 1, Concat,        [1]]                         # Layer 28: Concatenate Layer 27 (32x) and Layer 6 (32x)
  - [-1, 3, C2f,                [768]]                       # Layer 29: C2f module with 768 channels (32x)
  - [-1, 1, nn.Dropout2d,       [0.15]]                      # Layer 30: Dropout2d layer - FIXED typo

  - [[18, 22, 26, 30], 1, Segment, [nc, 32, 256]]            # Layer 31: Segment head - FIXED indices from [17, 21, 25, 29] to [18, 22, 26, 30]