# number of classes
nc: 1
stride: 224
# backbone
backbone:
  - [-1, 1, Timm, ['deit_small_patch16_224.fb_in1k', False, 3, True, [0, 1, 2, 3], 28, null, 'auto', False, False, True, False]]  # Layer 0: Timm backbone (x16)

head:
  # -------- ViT taps (all ~14x14 at 224 input) --------
  - [0, 1, Index, [0]]       # 1: f7
  - [0, 1, Index, [1]]      # 2: f12
  - [0, 1, Index, [2]]      # 3: f17
  - [0, 1, Index, [3]]      # 4: f22

  # -------- Lateral 1x1 (unify channels) --------
  - [1, 1, Conv, [256, 1, 1]]   # 5: f7_l  (14x14)
  - [2, 1, Conv, [256, 1, 1]]   # 6: f12_l (14x14)
  - [3, 1, Conv, [256, 1, 1]]   # 7: f17_l (14x14)
  - [4, 1, Conv, [256, 1, 1]]   # 8: f22_l (14x14)

  # -------- Same-res fusion at 14x14 (no up/down before concat) --------
  - [8, 1, SPPF, [256, 5]]      # 9: ctx(f22_l) at 14x14
  - [[9, 7], 1, Concat, [1]]    # 10: [f22_ctx, f17_l]
  - [10, 1, C2f, [256, True]]   # 11
  - [[11, 6], 1, Concat, [1]]   # 12: + f12_l
  - [12, 1, C2f, [256, True]]   # 13
  - [[13, 5], 1, Concat, [1]]   # 14: + f7_l
  - [14, 1, C2f, [256, True]]   # 15: F14 (fused 14x14 feature)  ← base “P3”

  # -------- Build the pyramid from F14 --------
  # P2 (28x28): nn.Upsample after fusion
  - [15, 1, nn.Upsample, [None, 2, 'nearest']]  # 16: up(F14) → 28x28
  - [16, 1, C2f, [256, True]]                # 17: P2

  # P4 (7x7) and P5 (~4x4): downsample from F14
  - [15, 1, Conv, [256, 3, 2]]               # 18: 7x7
  - [18, 1, C2f, [256, True]]                # 19: P4
  - [19, 1, Conv, [256, 3, 2]]               # 20: ~4x4
  - [20, 1, C2f, [256, True]]                # 21: P5

  # -------- Bottom-up PAN (P2→N3→N4→N5) --------
  - [17, 1, Conv, [256, 3, 2]]               # 22: down(P2) 28→14
  - [[22, 15], 1, Concat, [1]]               # 23: match 14x14 with F14
  - [23, 1, C2f, [256, True]]                # 24: N3 (14x14)

  - [24, 1, Conv, [256, 3, 2]]               # 25: 14→7
  - [[25, 19], 1, Concat, [1]]               # 26: with P4 (7x7)
  - [26, 1, C2f, [256, True]]                # 27: N4 (7x7)

  - [27, 1, Conv, [256, 3, 2]]               # 28: 7→~4
  - [[28, 21], 1, Concat, [1]]               # 29: with P5 (~4x4)
  - [29, 1, C2f, [256, True]]                # 30: N5 (~4x4)

  # -------- Segmentation head (balanced choice) --------
  # Use one high-res + two coarse scales:
  - [[17, 27, 30], 1, Segment, [nc, 32, 256]]  # P2 (28×28), N4 (7×7), N5 (~4×4)

