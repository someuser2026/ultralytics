# number of classes
nc: 1
stride: 224
# backbone
backbone:
  - [-1, 1, Timm, ['pvt_v2_b1.in1k', False, 3, True, [0, 1, 2, 3], 28, null, 'auto', False, False, True, False]]  # Layer 0: Timm backbone (x16)

head:
  # Extract features from Timm backbone
  - [0, 1, Index, [0]]                                       # Layer 1: Backbone Layer 0 (x4)
  - [0, 1, Index, [1]]                                       # Layer 2: Backbone Layer 1 (x8)
  - [0, 1, Index, [2]]                                       # Layer 3: Backbone Layer 2 (x16)
  - [0, 1, Index, [3]]                                       # Layer 4: Backbone Layer 3 (x32)

  - [-1, 1, nn.Upsample,        [None, 2, "nearest"]]        # Layer 5: Upsample by 2x (from 32x to 16x)
  - [[-1, 3], 1, Concat,        [1]]                        # Layer 6: Concatenate Layer 5 (16x) and Backbone Layer 3 (16x)
  # - [-1, 1, DeformableConv2d,   [768, 3, 1, 1, 1, 4, True, False]]  # Layer 7: Deformable Conv2d with 768 channels
  - [-1, 1, nn.Identity, []]
  - [-1, 3, C2f,                [768]]                     # Layer 8: C2f module with 768 channels (16x)

  - [-1, 1, nn.Upsample,        [None, 2, "nearest"]]        # Layer 9: Upsample by 2x (from 16x to 8x)
  - [[-1, 2], 1, Concat,        [1]]                        # Layer 10: Concatenate Layer 9 (8x) and Backbone Layer 2 (8x)
  # - [-1, 1, DeformableConv2d,   [384, 3, 1, 1, 1, 4, True, False]]   # Layer 11: Deformable Conv2d with 384 channels
  - [-1, 1, nn.Identity, []]
  - [-1, 3, C2f,                [384]]                      # Layer 12: C2f module with 384 channels (8x)

  - [-1, 1, nn.Upsample,        [None, 2, "nearest"]]        # Layer 13: Upsample by 2x (from 8x to 4x)
  - [[-1, 1], 1, Concat,        [1]]                        # Layer 14: Concatenate Layer 13 (4x) and Backbone Layer 1 (4x)
  - [-1, 3, C2f,                [192]]                      # Layer 15: C2f module with 192 channels (4x)

  - [-1, 1, Conv,               [192, 3, 2]]                # Layer 16: Downsample by 2x (from 4x to 8x) using Conv
  - [[-1, 12], 1, Concat,       [1]]                        # Layer 17: Concatenate Layer 16 (8x) and Layer 12 (8x)
  - [-1, 3, C2f,                [384]]                      # Layer 18: C2f module with 384 channels (8x)

  - [-1, 1, Conv,               [384, 3, 2]]                # Layer 19: Downsample by 2x (from 8x to 16x) using Conv
  - [[-1, 8], 1, Concat,        [1]]                        # Layer 20: Concatenate Layer 19 (16x) and Layer 8 (16x)
  - [-1, 3, C2f,                [768]]                     # Layer 21: C2f module with 768 channels (16x)

  - [-1, 1, Conv,               [768, 3, 2]]               # Layer 22: Downsample by 2x (from 16x to 32x) using Conv
  - [[-1, 4], 1, Concat,        [1]]                        # Layer 23: Concatenate Layer 22 (32x) and Layer 6 (32x)
  - [-1, 3, C2f,                [768]]                     # Layer 24: C2f module with 768 channels (32x)

  - [[15, 18, 21, 24], 1, Segment, [nc, 32, 256]]               # Layer 25: Segment head with input from Layers 15, 18, and 24