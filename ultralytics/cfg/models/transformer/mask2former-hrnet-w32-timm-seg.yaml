# Mask2Former instance segmentation with a timm HRNet-W32 backbone.
# timm out_indices 1-4 expose P2-P5 at strides 4, 8, 16, and 32.

nc: 80

backbone:
  - [-1, 1, Timm, ["hrnet_w32", False, 3, True, [1, 2, 3, 4], 32, null, "auto", False, False, False, False, 0.0]]

head:
  - [0, 1, Index, [0]]  # 1-P2/4, 128 channels
  - [0, 1, Index, [1]]  # 2-P3/8, 256 channels
  - [0, 1, Index, [2]]  # 3-P4/16, 512 channels
  - [0, 1, Index, [3]]  # 4-P5/32, 1024 channels

  - [[1, 2, 3, 4], 1, Mask2FormerHead, [nc, {
        feature_strides: [4, 8, 16, 32],
        transformer_in_features: [1, 2, 3],
        common_stride: 4,
        conv_dim: 256,
        mask_dim: 256,
        hidden_dim: 256,
        num_queries: 100,
        max_per_image: 100,
        mask_threshold: 0.5,
        nheads: 8,
        dec_layers: 10,
        enc_layers: 6,
        dim_feedforward: 2048,
        encoder_dim_feedforward: 1024,
        dropout: 0.0,
        pre_norm: false,
        class_weight: 2.0,
        mask_weight: 5.0,
        dice_weight: 5.0,
        no_object_weight: 0.1,
        train_num_points: 12544,
        oversample_ratio: 3.0,
        importance_sample_ratio: 0.75
  }]]
