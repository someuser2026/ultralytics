# Mask2Former instance segmentation with a YOLO12 backbone.
# This uses YOLO12 P2-P5 backbone features directly; the segmentation logic lives in Mask2FormerHead.

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]  # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]]  # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]]  # 8-P5/32

head:
  - [[2, 4, 6, 8], 1, Mask2FormerHead, [nc, {
        feature_strides: [4, 8, 16, 32],
        transformer_in_features: [1, 2, 3],
        common_stride: 4,
        conv_dim: 256,
        mask_dim: 256,
        hidden_dim: 256,
        num_queries: 100,
        nheads: 8,
        dec_layers: 10,
        enc_layers: 6,
        dim_feedforward: 2048,
        encoder_dim_feedforward: 1024,
        dropout: 0.0,
        pre_norm: false,
        class_weight: 2.0,
        mask_weight: 5.0,
        dice_weight: 5.0,
        no_object_weight: 0.1,
        train_num_points: 12544,
        oversample_ratio: 3.0,
        importance_sample_ratio: 0.75
  }]]
