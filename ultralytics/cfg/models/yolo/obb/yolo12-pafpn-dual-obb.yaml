# Dual-branch YOLO12 OBB model with RGB and auxiliary backbones fused before PAFPN.

nc: 1
stride: 224
dual_input_backbone: true
dual_input_rgb_channels: 3
dual_input_fusion: concat_proj
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, ChannelSplit, [3]] # 0 -> [rgb, aux]
  - [0, 1, Index, [0]] # 1 rgb input
  - [0, 1, Index, [1]] # 2 aux input

  # RGB backbone
  - [1, 1, Conv, [64, 3, 2]] # 3-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 4-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 5-P2 bottleneck
  - [-1, 1, Conv, [256, 3, 2]] # 6-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 7-P3 bottleneck
  - [-1, 1, Conv, [512, 3, 2]] # 8-P4/16
  - [-1, 4, A2C2f, [512, True, 4]] # 9-P4 bottleneck
  - [-1, 1, Conv, [1024, 3, 2]] # 10-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]] # 11-P5 bottleneck

  # Auxiliary backbone
  - [2, 1, Conv, [64, 3, 2]] # 12-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 13-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 14-P2 bottleneck
  - [-1, 1, Conv, [256, 3, 2]] # 15-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 16-P3 bottleneck
  - [-1, 1, Conv, [512, 3, 2]] # 17-P4/16
  - [-1, 4, A2C2f, [512, True, 4]] # 18-P4 bottleneck
  - [-1, 1, Conv, [1024, 3, 2]] # 19-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]] # 20-P5 bottleneck

  # Fuse same-scale bottlenecks by concat + 1x1 projection
  - [[5, 14], 1, Concat, [1]] # 21 fused P2 concat
  - [-1, 1, Conv, [256, 1, 1]] # 22 fused P2
  - [[7, 16], 1, Concat, [1]] # 23 fused P3 concat
  - [-1, 1, Conv, [512, 1, 1]] # 24 fused P3
  - [[9, 18], 1, Concat, [1]] # 25 fused P4 concat
  - [-1, 1, Conv, [512, 1, 1]] # 26 fused P4
  - [[11, 20], 1, Concat, [1]] # 27 fused P5 concat
  - [-1, 1, Conv, [1024, 1, 1]] # 28 fused P5

head:
  - [[22, 24, 26, 28], 1, PAFPN, [512, {
        normalize_channels: true,
        fusion: concat,
        drop_td: 0.10,
        drop_bu: 0.15,
        attn_cfg: {
          per_level: null,
          after_fuse: null
        },
        conv_cfg: {
          groups: 1,
          dilation: 1,
          dcn: {
            default: false,
            smooth_td: [0, 0, 0, 0],
            down_bu: [0, 0, 0],
            smooth_bu: [0, 0, 0]
          }
        }
  }]]

  - [29, 1, Index, [1]] # 30 P3
  - [29, 1, Index, [2]] # 31 P4
  - [29, 1, Index, [3]] # 32 P5
  - [[30, 31, 32], 1, OBB, [nc, 1]]
