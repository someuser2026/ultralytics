# YOLO12-obb Oriented Bounding Boxes (OBB) model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo12
# Task docs: https://docs.ultralytics.com/tasks/obb

# Parameters
nc: 1 # number of classes
stride: 224
scales: # model compound scaling constants, i.e. 'model=yolo12n-obb.yaml' will call yolo12-obb.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 287 layers, 2,673,955 parameters, 2,673,939 gradients, 6.9 GFLOPs
  # s: [0.50, 0.50, 1024] # summary: 287 layers, 9,570,275 parameters, 9,570,259 gradients, 22.7 GFLOPs
  # m: [0.50, 1.00, 512] # summary: 307 layers, 21,048,003 parameters, 21,047,987 gradients, 71.8 GFLOPs
  # l: [1.00, 1.00, 512] # summary: 503 layers, 27,299,619 parameters, 27,299,603 gradients, 93.4 GFLOPs
  # x: [1.00, 1.50, 512] # summary: 503 layers, 61,119,939 parameters, 61,119,923 gradients, 208.6 GFLOPs

# YOLO12n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]] # 8

# YOLO12n head
head:
  # --------------------------------------------------------------------------
  # Step 2: Apply PAFPN Neck (replaces your manual TD+BU paths)
  # --------------------------------------------------------------------------
  # Original config has:
  # - Top-down: P5→P4→P3→P2 with concat fusion + C2f
  # - Bottom-up: P2→P3→P4→P5 with concat fusion + C2f
  # - Output channels: [192, 384, 768, 768] at scales [x4, x8, x16, x32]
  
  # --- Neck definition ---
  - [[2, 4, 6, 10], 1, PAFPN, [512, {
        normalize_channels: true,           # Align backbone channels to 256 via 1x1 convs
        fusion: concat,                     # Use concat fusion in both TD and BU paths
        drop_td: 0.10,                      # 10% dropout in top-down path
        drop_bu: 0.15,                      # 15% dropout in bottom-up path
        attn_cfg: {                         # Optional attention modules
          per_level: null,                   # Apply ECA after channel alignment (per level)
          after_fuse: null                 # Apply Coordinate Attention after fusion
        },
        conv_cfg: {                         # Per-role deformable conv control
          groups: 1,                        # Grouped convs (1 = standard)
          dilation: 1,                      # No dilation
          dcn: {
            default: false,                 # All others use standard conv
            smooth_td: [0, 0, 0, 0],        # Use DCN in top-down smoothing for first 2 levels
            down_bu: [0, 0, 0],             # DCN only in 2nd bottom-up downsample
            smooth_bu: [0, 0, 0]            # DCN in final bottom-up smoothing
          }
        }
  }]]

    # Layer 5: PAFPN outputs 4 levels, but we need different channels per level
    # Output: [256, 256, 256, 256] @ [x4, x8, x16, x32]
  
  # --------------------------------------------------------------------------
  # Step 3: Adjust channels to match original [192, 384, 768, 768]
  # --------------------------------------------------------------------------
  # Extract each PAFPN level and adjust channels
  # - [5, 1, Index, [0]]            # Layer 6: P2_fpn (256ch @ x4)
  # - [-1, 1, Conv, [192, 1, 1]]    # Layer 7: P2_out (192ch @ x4) - matches Layer 15
  
  - [11, 1, Index, [1]]            # Layer 8: P3_fpn (256ch @ x8)
  # - [-1, 1, Conv, [384, 1, 1]]    # Layer 9: P3_out (384ch @ x8) - matches Layer 18
  
  - [11, 1, Index, [2]]            # Layer 10: P4_fpn (256ch @ x16)
  # - [-1, 1, Conv, [768, 1, 1]]    # Layer 11: P4_out (768ch @ x16) - matches Layer 21
  
  - [11, 1, Index, [3]]            # Layer 12: P5_fpn (256ch @ x32)
  # - [-1, 1, Conv, [768, 1, 1]]    # Layer 13: P5_out (768ch @ x32) - matches Layer 24

  # --------------------------------------------------------------------------
  # Step 4: Segmentation Head (using 3 scales)
  # --------------------------------------------------------------------------
  - [[12, 13, 14], 1, OBB, [nc, 1]]
